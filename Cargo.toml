[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/edirstat"]
# launcher/ is its own workspace (its Cargo.toml says why).
exclude = ["launcher"]

[workspace.package]
version = "2.2.0"
edition = "2024"
license = "MIT"
authors = ["Cody Wyatt Neiman (xangelix) <neiman@cody.to>"]
repository = "https://github.com/xangelix/edirstat"

# seaworthy, pinned to one commit (scripts/use-seaworthy-git.sh moves it).
[workspace.dependencies]
seaworthy-launcher = { git = "https://github.com/xangelix/seaworthy", rev = "21a23431487ca40f2f249c0edde938efc8e09b1e" }

[patch.crates-io]
winit = { git = "https://github.com/xangelix/winit.git", branch = "blur-fix" }
# egui-table-kit = { path = "../egui-table-kit" }

[profile.release]
panic = "abort"
strip = true
lto = "thin"
# debug = true
codegen-units = 1
