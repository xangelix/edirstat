name: Package Production Release Binaries

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Every package seaworthy builds from seaworthy.toml, through its reusable
  # workflow: one core per CPU target plus the launcher (Linux in a Debian 12
  # container, so the binaries run on glibc 2.34 and newer; Windows natively
  # with MSVC; macOS on Apple Silicon), the deb, rpm, pacman and tarball, the
  # Windows zip and MSI, and the macOS disk image, Developer ID-signed and
  # notarized with the Apple secrets. Everything lands, checked against its
  # listing with SHA256SUMS, in the `seaworthy-packages` artifact.
  dist:
    name: seaworthy (Linux, Windows, macOS packages)
    # The commit Cargo.toml pins seaworthy to (scripts/use-seaworthy-git.sh).
    uses: xangelix/seaworthy/.github/workflows/dist.yml@912c440b1d86b5c6c14948ede5069a484103cc4a # seaworthy 912c440b1d86
    # contents: read alone: id-token: write is for Azure Artifact Signing
    # (the azure-* inputs), and dist.yml refuses it without them.
    permissions:
      contents: read
    with:
      # Versioned from the release's tag, signed with the secrets given.
      release: true
      # Only macOS is signed: the Apple secrets below Developer ID-sign and
      # notarize the disk image, and because seaworthy.toml pins the team
      # ([defaults.apple]), a release whose Apple secrets don't reach the
      # macOS job fails instead of shipping an ad hoc-signed dmg. The Linux
      # and Windows packages ship unsigned, as the releases before seaworthy
      # did: their job gets no signer, which a release refuses unless
      # allow-unsigned says it's meant. To sign them later: Authenticode
      # (the AUTHENTICODE_PFX secrets or the azure-* inputs, and
      # [defaults.authenticode] in seaworthy.toml), and OPENPGP_SECRET_KEY
      # with openpgp-keys for rpm and pacman; then drop this.
      allow-unsigned: true
      # No CI test keys: eDirStat has no update helper.
      ci-test-keys: false
      # Long enough to check the disk image before approving the itch.io
      # deploy; delete-artifacts removes them once the deploys are done.
      retention-days: 3
    secrets:
      APPLE_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  # macOS beyond seaworthy's Apple Silicon disk image: the Intel (x86_64)
  # Developer ID build (itch.io's osx-x86_64 channel), and the Mac App Store
  # package (aarch64).
  build-macos:
    name: Package macOS Production (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]

    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPSTORE_PROVISIONPROFILE: ${{ secrets.APPSTORE_PROVISIONPROFILE }}

    steps:
      - name: Checkout Source Code
        if: matrix.target == 'x86_64-apple-darwin' || env.APPSTORE_PROVISIONPROFILE != ''
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        if: matrix.target == 'x86_64-apple-darwin' || env.APPSTORE_PROVISIONPROFILE != ''
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        if: matrix.target == 'x86_64-apple-darwin' || env.APPSTORE_PROVISIONPROFILE != ''
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # A release must never silently ship unsigned: fail loud if the
      # secrets aren't installed (see AGENTS/release docs for the list).
      - name: Require signing secrets
        if: matrix.target == 'x86_64-apple-darwin' || env.APPSTORE_PROVISIONPROFILE != ''
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ] || [ -z "$APPLE_API_KEY" ]; then
            echo "::error::macOS release packaging requires MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER secrets."
            exit 1
          fi

      - name: Import signing identity & notary credentials
        if: matrix.target == 'x86_64-apple-darwin' || env.APPSTORE_PROVISIONPROFILE != ''
        run: |
          set -euo pipefail
          KEYCHAIN="edirstat-ci.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          umask 077
          echo "$MACOS_CERTIFICATE_P12" | base64 -d > signing.p12
          security import signing.p12 -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm signing.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security list-keychains -s "$KEYCHAIN"

          echo "$APPLE_API_KEY" | base64 -d > AuthKey.p8
          xcrun notarytool store-credentials notary \
            --key AuthKey.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          rm AuthKey.p8

      # Apple Silicon's Developer ID disk image comes from seaworthy (dist);
      # Intel Macs keep the single-binary build.
      - name: Build, Bundle, Sign & Notarize (Intel)
        if: matrix.target == 'x86_64-apple-darwin'
        run: ./scripts/package_macos.sh --target "${{ matrix.target }}" --validate

      - name: Upload the Intel Disk Image
        if: matrix.target == 'x86_64-apple-darwin'
        uses: actions/upload-artifact@v7
        with:
          name: edirstat-macos-${{ matrix.target }}
          path: |
            edirstat-macos-*.dmg
            edirstat-macos-*.zip
          retention-days: 3

      - name: Build & Package Mac App Store .pkg (aarch64)
        if: matrix.target == 'aarch64-apple-darwin' && env.APPSTORE_PROVISIONPROFILE != ''
        run: |
          set -euo pipefail
          umask 077
          echo "$APPSTORE_PROVISIONPROFILE" | base64 -d > appstore.provisionprofile
          ./scripts/package_macos.sh --target aarch64-apple-darwin --appstore --build "${{ github.run_number }}" --validate
          rm -f appstore.provisionprofile

      - name: Upload the Mac App Store .pkg
        if: matrix.target == 'aarch64-apple-darwin' && env.APPSTORE_PROVISIONPROFILE != ''
        uses: actions/upload-artifact@v7
        with:
          name: edirstat-appstore-pkg
          path: edirstat-appstore-*.pkg
          retention-days: 3

      - name: Cleanup keychain & sensitive files
        if: always()
        run: |
          security delete-keychain edirstat-ci.keychain-db 2>/dev/null || true
          rm -f appstore.provisionprofile signing.p12 AuthKey.p8 2>/dev/null || true

  deploy-itchio:
    name: Deploy to itch.io
    runs-on: ubuntu-latest
    needs: [dist, build-macos]
    # Environment scoping enables an approval gate before pushing to the paid
    # store, and lets the BUTLER_API_KEY secret be scoped to this deployment
    # (Settings → Environments → itchio).
    environment: itchio

    steps:
      - name: Download the seaworthy packages
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.dist.outputs.packages-artifact }}
          path: dl-packages

      - name: Download the Intel disk image
        uses: actions/download-artifact@v8
        with:
          name: edirstat-macos-x86_64-apple-darwin
          path: dl-macos-x86_64

      - name: Stage Channels
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          (cd dl-packages && sha256sum --check --strict SHA256SUMS)
          # Versioned filenames become the download names shown on itch.io
          VERSION="${TAG#v}"
          linux=dl-packages/packages/edirstat/packages
          macos=dl-packages/packages-macos/edirstat/packages
          mkdir -p staging-windows staging-windows-installer staging-osx staging-osx-intel
          mkdir -p staging-linux-portable staging-linux-deb staging-linux-rpm staging-linux-pacman

          # Windows portable: the launcher, its per-CPU cores and the license
          # (the zip's one directory, unpacked).
          unzip -q "$linux"/*-windows-x86_64.zip -d staging-windows-unpacked
          mv staging-windows-unpacked/*/* staging-windows/

          # Windows installer: seaworthy's MSI (C:\Program Files\xangelix\eDirStat).
          # It replaced the Inno Setup installer, which installed elsewhere:
          # an install from that one is uninstalled first (Settings → Apps).
          cp "$linux"/*-windows-x86_64.msi "staging-windows-installer/edirstat-$VERSION-windows-x86_64.msi"

          # macOS (Apple Silicon): seaworthy's Developer ID disk image
          cp "$macos"/*-macos-arm64.dmg "staging-osx/edirstat-$VERSION-macos-aarch64.dmg"

          # macOS (Intel): the Developer ID single-binary build (build-macos)
          cp dl-macos-x86_64/edirstat-macos-x86_64-*.dmg "staging-osx-intel/edirstat-$VERSION-macos-x86_64.dmg"

          # Linux portable: the launcher, lib/ with the cores, the license
          tar --zstd -xf "$linux"/*-linux-x86_64.tar.zst -C staging-linux-portable --strip-components=1

          # Linux Distros (Dedicated standalone files per channel)
          cp "$linux"/*_amd64.deb staging-linux-deb/
          cp "$linux"/*.x86_64.rpm staging-linux-rpm/
          cp "$linux"/*-x86_64.pkg.tar.zst staging-linux-pacman/

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Determine version
          VERSION="${TAG#v}" # strip 'v' prefix if present
          echo "Deploying version: $VERSION"

          # Ensure butler is available in PATH, downloading it as a fallback if necessary
          if ! command -v butler &> /dev/null; then
            echo "butler not found in PATH, installing..."
            curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
            mkdir -p "$HOME/.local/bin"
            unzip -o butler.zip -d "$HOME/.local/bin"
            rm butler.zip
            export PATH="$HOME/.local/bin:$PATH"
          fi

          # Push Windows packages
          butler push staging-windows/ xangelix/edirstat:windows-portable --userversion "$VERSION"
          butler push staging-windows-installer/ xangelix/edirstat:windows-setup --userversion "$VERSION"

          # Push macOS packages
          butler push staging-osx/ xangelix/edirstat:osx-arm64 --userversion "$VERSION"
          butler push staging-osx-intel/ xangelix/edirstat:osx-x86_64 --userversion "$VERSION"

          # Push dedicated Linux channels
          butler push staging-linux-portable/ xangelix/edirstat:linux-portable --userversion "$VERSION"
          butler push staging-linux-deb/ xangelix/edirstat:linux-deb --userversion "$VERSION"
          butler push staging-linux-rpm/ xangelix/edirstat:linux-rpm --userversion "$VERSION"
          butler push staging-linux-pacman/ xangelix/edirstat:linux-pacman --userversion "$VERSION"

          # Legacy alias channel (points to deb package)
          butler push staging-linux-deb/ xangelix/edirstat:linux-setup --userversion "$VERSION"

  deliver-appstore:
    name: Deliver Mac App Store & Submit for Review
    runs-on: macos-latest
    needs: [build-macos]
    environment: appstore
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Download Mac App Store Package Artifact
        uses: actions/download-artifact@v8
        id: download-pkg
        continue-on-error: true
        with:
          name: edirstat-appstore-pkg
          path: staging-appstore

      - name: Deliver and Submit to App Store Connect
        if: steps.download-pkg.outcome == 'success'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          PKG="$(find staging-appstore -type f -name "edirstat-appstore-*.pkg" 2>/dev/null | head -1 || true)"
          if [ -z "$PKG" ]; then
            echo "::warning::No Mac App Store package artifact found to deliver."
            exit 0
          fi
          echo "==> Delivering $PKG to Mac App Store..."
          ./scripts/deliver_macos.sh --pkg "$PKG"

  # This run's artifacts are what itch.io sells: the per-CPU cores, every
  # package and the signed disk images. Artifacts of a public repository are
  # not private: any signed-in GitHub user can download them, and proxies
  # such as nightly.link serve them without a login. So once itch.io and
  # App Store Connect have the builds, they are deleted. A failed or
  # rejected deploy leaves them for "Re-run failed jobs" until they expire
  # (retention-days above).
  delete-artifacts:
    name: Delete the Release Artifacts
    needs: [deploy-itchio, deliver-appstore]
    # seaworthy's, at the commit dist.yml is pinned to.
    uses: xangelix/seaworthy/.github/workflows/delete-artifacts.yml@912c440b1d86b5c6c14948ede5069a484103cc4a # seaworthy 912c440b1d86
    permissions:
      actions: write # to delete this run's artifacts
