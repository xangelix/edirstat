name: Package Production Release Binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-linux:
    name: Package Linux Production
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/xangelix-pub/containers/arch-rust-nightly-pin-common:latest
      options: --user root # How I wish this were GitLab

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2

      - name: Compile optimized release binary
        run: cargo build --release

      - name: Stage Artifact
        run: |
          mkdir -p staging
          cp target/release/edirstat staging/edirstat-linux-x86_64

      - name: Store Production Binary as Private Artifact
        uses: actions/upload-artifact@v7
        with:
          name: edirstat-linux-x86_64
          path: staging/edirstat-linux-x86_64

      # - name: Upload Asset to GitHub Release
      #   uses: softprops/action-gh-release@v3
      #   with:
      #     files: staging/edirstat-linux-x86_64
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Package macOS Production
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]

    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-15
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # A release must never silently ship unsigned: fail loud if the
      # secrets aren't installed (see AGENTS/release docs for the list).
      - name: Require signing secrets
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ] || [ -z "$APPLE_API_KEY" ]; then
            echo "::error::macOS release packaging requires MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER secrets."
            exit 1
          fi

      - name: Import signing identity & notary credentials
        run: |
          set -euo pipefail
          KEYCHAIN="edirstat-ci.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          umask 077
          echo "$MACOS_CERTIFICATE_P12" | base64 -d > signing.p12
          security import signing.p12 -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm signing.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security list-keychains -s "$KEYCHAIN"

          echo "$APPLE_API_KEY" | base64 -d > AuthKey.p8
          xcrun notarytool store-credentials notary \
            --key AuthKey.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          rm AuthKey.p8

      - name: Build, Bundle, Sign & Notarize
        run: ./scripts/package_macos.sh --target "${{ matrix.target }}" --validate

      - name: Store macOS Package as Private Artifact
        uses: actions/upload-artifact@v7
        with:
          name: edirstat-macos-${{ matrix.target }}
          path: edirstat-macos-*.zip

      # - name: Upload Asset to GitHub Release
      #   uses: softprops/action-gh-release@v3
      #   with:
      #     files: edirstat-macos-*.zip
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain edirstat-ci.keychain-db || true

  # One parallel leg per (target, CPU) pair: each builds a single optimized
  # variant binary. combine-multivers merges them into the multivers wrappers.
  build-multivers-variants:
    name: Multivers Variant (${{ matrix.target }} / ${{ matrix.cpu }})
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/xangelix-pub/containers/arch-rust-nightly-pin-common:latest
      options: --user root # How I wish this were GitLab

    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu]
        # Keep in sync with TARGET_CPUS in scripts/build_local_multivers.sh
        cpu: [x86-64-v2, x86-64-v3, x86-64-v4, znver3, znver4, znver5, skylake, alderlake]

    env:
      TARGETS: ${{ matrix.target }}
      TARGET_CPUS: ${{ matrix.cpu }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2
        with:
          # Per-leg caches keep each variant's dependency tree warm across runs
          key: multivers-${{ matrix.target }}-${{ matrix.cpu }}
          cache-on-failure: true

      - name: Install MinGW cross toolchain
        if: contains(matrix.target, 'windows')
        run: pacman -Syu --noconfirm --needed mingw-w64-gcc

      - name: Build CPU Variant
        run: MULTIVERS_SKIP_WRAPPER=1 ./scripts/build_local_multivers.sh

      - name: Store Variant Artifact
        uses: actions/upload-artifact@v7
        with:
          name: multivers-${{ matrix.target }}-${{ matrix.cpu }}
          path: target/${{ matrix.target }}/release/edirstat-${{ matrix.cpu }}${{ endsWith(matrix.target, 'windows-gnu') && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 1

  # Downloads the per-CPU variant binaries, combines them into the two
  # multivers wrapper executables, and builds the Arch pacman package.
  combine-multivers:
    name: Combine Multivers Wrappers & Pacman Package
    runs-on: ubuntu-latest
    needs: [build-multivers-variants]
    container:
      image: registry.gitlab.com/xangelix-pub/containers/arch-rust-nightly-pin-common:latest
      options: --user root # How I wish this were GitLab

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2
        with:
          # Save even on failure: keeps the wrapper build's deps warm
          cache-on-failure: true

      - name: Install Packaging Dependencies
        run: pacman -Syu --noconfirm --needed mingw-w64-gcc pacman-contrib

      - name: Configure safe directory for Git
        run: git config --global --add safe.directory "*"

      - name: Download Multivers Variants
        uses: actions/download-artifact@v8
        with:
          pattern: multivers-*
          merge-multiple: true
          path: staging-variants

      - name: Stage Variant Binaries per Target
        run: |
          mkdir -p target/x86_64-unknown-linux-gnu/release target/x86_64-pc-windows-gnu/release
          find staging-variants -type f -name '*.exe' -exec cp -t target/x86_64-pc-windows-gnu/release {} +
          find staging-variants -type f ! -name '*.exe' -exec cp -t target/x86_64-unknown-linux-gnu/release {} +

      - name: Build Multivers Wrappers
        # TARGET_CPUS defaults to the full variant list in the script; keep
        # the matrix legs above in sync with it.
        run: MULTIVERS_SKIP_VARIANTS=1 ./scripts/build_local_multivers.sh

      - name: Build Arch Linux Pacman Package as tux user
        run: |
          # 1. Determine version
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"

          # 2. Stage binary in /home/tux matching manual source name
          cp target/x86_64-unknown-linux-gnu/release/edirstat_multivers /home/tux/edirstat-$VERSION-portable-x86_64
          chown tux:tux /home/tux/edirstat-$VERSION-portable-x86_64

          # 3. Clone and build as the tux user to bypass makepkg root restriction.
          #    The script is piped to bash via stdin (quoted heredoc): passing a
          #    multi-line script through `sudo -i bash -c "..."` re-joins the
          #    arguments and flattens the newlines into one broken line.
          sudo -u tux HOME=/home/tux VERSION="$VERSION" bash <<'EOF'
          set -euo pipefail
          cd /home/tux
          rm -rf edirstat-bin
          git clone https://aur.archlinux.org/edirstat-bin.git
          cd edirstat-bin

          # Place precompiled binary in build directory
          cp "/home/tux/edirstat-$VERSION-portable-x86_64" ./

          # Update version properties
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD

          # Never emit makepkg's debug split package (default `debug` option);
          # a multi-file channel upload makes itch.io wrap it as a zip
          echo "options=('!debug')" >> PKGBUILD

          # Automatically resolve checksums for the local binary and download metadata
          updpkgsums

          # Build and package
          makepkg -s --noconfirm
          EOF

          # 4. Copy the compiled package back to workspace (main package only,
          #    never a debug split package)
          mkdir -p staging-linux-installer
          cp /home/tux/edirstat-bin/edirstat-bin-"$VERSION"-*-x86_64.pkg.tar.zst staging-linux-installer/

      - name: Store Multivers Windows Wrapper
        uses: actions/upload-artifact@v7
        with:
          name: multivers-windows-exe
          path: target/x86_64-pc-windows-gnu/release/edirstat_multivers.exe

      - name: Store Multivers Linux Wrapper
        uses: actions/upload-artifact@v7
        with:
          name: multivers-linux
          path: target/x86_64-unknown-linux-gnu/release/edirstat_multivers

      - name: Store Pacman Package
        uses: actions/upload-artifact@v7
        with:
          name: edirstat-pacman-pkg
          path: staging-linux-installer/

  package-windows-installer:
    name: Package Windows Installer (Multivers, Inno Setup)
    runs-on: windows-latest
    needs: [combine-multivers]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Download Multivers Windows Wrapper
        uses: actions/download-artifact@v8
        with:
          name: multivers-windows-exe
          path: dl-multivers

      - name: Stage Payload for Inno Setup
        run: |
          mkdir -Force target\release
          cp -Force dl-multivers\edirstat_multivers.exe target\release\edirstat.exe

      - name: Compile Inno Setup Installer
        shell: powershell
        run: |
          # 1. Extract the version string from Cargo.toml
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.*?)"').Matches.Groups[1].Value
          echo "Detected Cargo Version: $version"

          # 2. Compile passing the version dynamically, with a versioned filename
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$version /Fedirstat-$version-setup-x86_64 installer.iss

      - name: Store Production Installer as Private Artifact
        uses: actions/upload-artifact@v7
        with:
          name: edirstat-setup-x86_64.exe
          path: staging\edirstat-*-setup-x86_64.exe

  deploy-itchio:
    name: Deploy to itch.io
    runs-on: ubuntu-latest
    needs: [combine-multivers, package-windows-installer, build-macos]
    # Environment scoping enables an approval gate before pushing to the paid
    # store, and lets the BUTLER_API_KEY secret be scoped to this deployment
    # (Settings → Environments → itchio).
    environment: itchio
    container:
      image: registry.gitlab.com/xangelix-pub/containers/arch-rust-nightly-pin-common:latest
      options: --user root # How I wish this were GitLab

    steps:
      - name: Install Deploy Dependencies
        run: pacman -Syu --noconfirm --needed curl unzip

      - name: Download Windows Installer Artifact
        uses: actions/download-artifact@v8
        with:
          name: edirstat-setup-x86_64.exe
          path: staging-windows-installer

      - name: Download Multivers Windows Wrapper
        uses: actions/download-artifact@v8
        with:
          name: multivers-windows-exe
          path: dl-multivers-windows

      - name: Download Multivers Linux Wrapper
        uses: actions/download-artifact@v8
        with:
          name: multivers-linux
          path: dl-multivers-linux

      - name: Download Pacman Package
        uses: actions/download-artifact@v8
        with:
          name: edirstat-pacman-pkg
          path: staging-linux-installer

      - name: Download macOS aarch64 Production Artifact
        uses: actions/download-artifact@v8
        with:
          name: edirstat-macos-aarch64-apple-darwin
          path: dl-macos-aarch64

      - name: Stage Channels
        run: |
          # Versioned filenames become the download names shown on itch.io
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          mkdir -p staging-windows staging-linux staging-osx
          cp dl-multivers-windows/edirstat_multivers.exe "staging-windows/edirstat-$VERSION-portable-x86_64.exe"
          cp dl-multivers-linux/edirstat_multivers "staging-linux/edirstat-$VERSION-portable-x86_64"
          chmod +x "staging-linux/edirstat-$VERSION-portable-x86_64"
          cp dl-macos-aarch64/edirstat-macos-aarch64-*.zip "staging-osx/edirstat-$VERSION-macos-aarch64.zip"

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          # Determine version
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}" # strip 'v' prefix if present
          echo "Deploying version: $VERSION"

          # Ensure butler is available in PATH, downloading it as a fallback if necessary
          if ! command -v butler &> /dev/null; then
            echo "butler not found in PATH, installing..."
            curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
            unzip -o butler.zip -d /usr/local/bin
            rm butler.zip
          fi

          # Push all packages to itch.io
          butler push staging-windows/ xangelix/edirstat:windows-portable --userversion "$VERSION"
          butler push staging-windows-installer/ xangelix/edirstat:windows-setup --userversion "$VERSION"
          butler push staging-linux/ xangelix/edirstat:linux-portable --userversion "$VERSION"
          butler push staging-linux-installer/ xangelix/edirstat:linux-setup --userversion "$VERSION"
          butler push staging-osx/ xangelix/edirstat:osx-arm64 --userversion "$VERSION"
