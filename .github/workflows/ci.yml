name: CI Pipeline

on:
  # Post-merge builds and deploys. Feature branches are covered by
  # `pull_request`, which tests the merge result; running both would
  # duplicate every job.
  push:
    branches:
      - main
      - dev
  pull_request:
  # Manual runs for branches without a PR.
  workflow_dispatch:

# A new push to a PR supersedes its in-flight run; main/dev runs always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # Pinned to the versions the committed files were checked and generated with: a newer
      # typos may flag new words, and cargo-about's output and fontTools' subsets are compared
      # byte for byte.
      - name: Install typos, cargo-shear, cargo-nextest and cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: typos@1.51.1,cargo-shear@1.14.0,cargo-nextest,cargo-about@0.9.2

      - name: Install fontTools
        run: |
          python3 -m venv "$RUNNER_TEMP/fonttools"
          "$RUNNER_TEMP/fonttools/bin/pip" install --quiet fonttools==4.67.0
          echo "$RUNNER_TEMP/fonttools/bin" >> "$GITHUB_PATH"

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2

      - name: Check typos
        run: ./scripts/check.sh typos

      - name: Check formatting
        run: ./scripts/check.sh fmt

      - name: Check for unused dependencies
        run: ./scripts/check.sh shear

      - name: Check lints
        run: ./scripts/check.sh clippy

      - name: Run tests
        run: ./scripts/check.sh test

      - name: Verify fallback fonts match translation corpus
        run: ./scripts/check.sh fonts

      - name: Verify licenses matching committed ones
        run: ./scripts/check.sh licenses

  test-macos:
    name: Tests (macOS Native)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2

      - name: Run tests
        run: ./scripts/check.sh test

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: [test-linux, test-macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2

      - name: Compile optimized release binary
        run: cargo build --release

      - name: Stage Artifact
        run: |
          mkdir -p staging
          cp target/release/edirstat staging/edirstat-linux-x86_64

      - name: Upload Asset as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: edirstat-linux-x86_64
          path: staging/edirstat-linux-x86_64

  build-wasm:
    name: Build Web (wasm32)
    runs-on: ubuntu-latest
    needs: [test-linux, test-macos]
    env:
      BINARYEN_VERSION: "130"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2

      - name: Install binaryen (wasm-opt)
        run: |
          curl -fsSL --retry 3 "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install wasm-bindgen-cli matching lockfile
        run: |
          cargo install wasm-bindgen-cli --version $(grep -A 1 'name = "wasm-bindgen"' Cargo.lock | grep version | cut -d '"' -f 2)

      # The nightly wasm build rebuilds std (-Zbuild-std): Cargo's `[unstable]` configuration,
      # set here by environment.
      - name: Compile and package web frontend
        env:
          CARGO_UNSTABLE_BUILD_STD: panic_abort,std
        run: ./scripts/build_web.sh

      - name: Upload Web Viewer Dist
        uses: actions/upload-artifact@v7
        with:
          name: wasm-dist
          path: crates/edirstat-gui/dist

  build-windows:
    name: Build & Package Windows (Inno Setup)
    runs-on: windows-latest
    needs: [test-linux, test-macos]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2

      - name: Compile optimized release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Restructure Build Path
        run: |
          mkdir -Force target\release
          cp -Force target\x86_64-pc-windows-msvc\release\edirstat.exe target\release\edirstat.exe
          # installer.iss installs staging\windows (in a release, seaworthy's
          # launcher and cores; here the single CI binary)
          mkdir -Force staging\windows
          cp -Force target\release\edirstat.exe staging\windows\edirstat.exe

      - name: Compile Inno Setup Installer
        shell: powershell
        run: |
          # 1. Extract the version string from Cargo.toml
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.*?)"').Matches.Groups[1].Value
          echo "Detected Cargo Version: $version"

          # 2. Compile passing the version dynamically
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$version installer.iss

      - name: Prepare Portable ZIP
        run: |
          compress-archive -Path target\release\edirstat.exe -DestinationPath staging\edirstat-windows-portable-x86_64.zip

      - name: Upload Portable ZIP as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: edirstat-windows-portable-x86_64.zip
          path: staging\edirstat-windows-portable-x86_64.zip

      - name: Upload Installer as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: edirstat-setup-x86_64.exe
          path: staging\edirstat-setup-x86_64.exe

  build-macos:
    name: Build & Package macOS
    runs-on: macos-latest
    needs: [test-linux, test-macos]
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Package (ad-hoc sign)
        run: ./scripts/package_macos.sh --target "${{ matrix.target }}" --ad-hoc --validate

      - name: Upload Asset as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: edirstat-macos-${{ matrix.target }}
          path: |
            edirstat-macos-*.dmg
            edirstat-macos-*.zip

  deploy-web:
    name: Deploy Web (Cloudflare Workers)
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/xangelix-pub/containers/arch
      options: --user root # How I wish this were GitLab
    needs: [build-wasm]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    permissions:
      contents: read

    # Allow only one concurrent deployment per branch
    concurrency:
      group: "cloudflare-deploy-${{ github.ref }}"
      cancel-in-progress: true

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install System Dependencies
        run: |
          paru -Syu --noconfirm zola nodejs npm python-markdown

      - name: Download WASM Dist
        uses: actions/download-artifact@v8
        with:
          name: wasm-dist
          path: crates/edirstat-gui/dist

      - name: Install Node Dependencies & Build Assets
        run: |
          cd web
          npm ci
          npm run build

      - name: Deploy to Cloudflare Workers (Prod)
        if: github.ref == 'refs/heads/main'
        run: |
          cd web
          npx --yes wrangler deploy --env prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers (Dev)
        if: github.ref == 'refs/heads/dev'
        run: |
          cd web
          npx --yes wrangler deploy --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

